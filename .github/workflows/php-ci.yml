name: PHP CI Application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Demonstrate GitHub Secret
        env:
          MY_SUPER_SECRET_KEY: ${{ secrets.MY_SUPER_SECRET_KEY }}
        run: |
          if [ -n "$MY_SUPER_SECRET_KEY" ]; then
            echo "GitHub Secret is configured."
          else
            echo "GitHub Secret is missing."
            exit 1
          fi

      - name: Lint code with Pint
        run: ./vendor/bin/pint --test

      - name: Run unit tests
        run: ./vendor/bin/phpunit tests/Unit